[package]
name = "bevy-steamworks"
version = "0.17.0"
authors = ["james7132 <contact@jamessliu.com>"]
edition = "2021"
description = "A Bevy plugin for integrating with the Steamworks SDK."
repository = "https://github.com/HouraiTeahouse/bevy-steamworks"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "gamedev", "steam"]

[features]
default = []
serde = ["steamworks/serde"]
raw-bindings = ["steamworks/raw-bindings"]

[dependencies]
bevy_app = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false }
steamworks = "0.13.1"

[dev-dependencies]
bevy = "0.19"

# Temporary: styled Steam Input glyph support, pending an upstream steamworks release.
[patch.crates-io]
steamworks = { git = "https://github.com/trevor-coleman/steamworks-rs", rev = "ecc66bb" }

[[example]]
name = "glyphs"
required-features = ["raw-bindings"]
